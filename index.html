<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#260b12">
  <title>Shravan &amp; Nikki | Wedding Invitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    :root {
      --burgundy: #721b2c;
      --deep-burgundy: #581321;
      --gold: #bd914b;
      --cream: #fff2d9;
      --ink: #593b35;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #17080c;
    }

    body {
      min-height: 100svh;
      display: flex;
      justify-content: center;
      color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif;
      overflow-x: hidden;
    }

    .card {
      position: relative;
      width: min(100vw, 540px);
      height: 100svh;
      min-height: 680px;
      max-height: 1100px;
      overflow: hidden;
      background: #f8e9cf;
      isolation: isolate;
    }

    .visual,
    .visual img,
    .visual video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .visual img,
    .visual video {
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .opening {
      z-index: 3;
      opacity: 1;
      transition: opacity .8s ease;
    }

    .opening.dismissed {
      opacity: 0;
      pointer-events: none;
    }

    .open-hotspot {
      position: absolute;
      left: 50%;
      top: 55.5%;
      transform: translate(-50%, -50%);
      width: min(55%, 260px);
      aspect-ratio: 1 / 1;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .8s ease;
    }

    .opening.dismissed .open-hotspot { opacity: 0; }

    .open-hotspot img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .open-hotspot:focus-visible {
      outline: 2px solid rgba(255,255,255,.9);
      outline-offset: 4px;
    }

    .video-layer {
      z-index: 2;
      display: block;
      background: #18090d;
    }

    .video-layer video { object-fit: fill; }

    .invitation {
      position: absolute;
      z-index: 4;
      left: 12%;
      right: 12%;
      top: 24%;
      bottom: 5.5%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      padding: 0 0 2%;
      overflow-y: auto;
      scrollbar-width: none;
      transition: opacity .7s ease;
    }

    .invitation::-webkit-scrollbar { display: none; }

    .invitation.visible {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    .reveal {
      opacity: 0;
      transform: translateY(13px);
      filter: blur(2px);
    }

    .invitation.visible .reveal {
      animation: fadeUp .95s cubic-bezier(.2,.7,.2,1) forwards;
      animation-delay: var(--delay, 0s);
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    /* Logo increased by approximately 20%; its top position is unchanged. */
    .wedding-logo {
  width: clamp(130px, 34vw, 175px);
  height: auto;
  max-height: 150px;
      object-fit: contain;
      object-position: center;
      margin: 0 auto 1.2%;
      flex-shrink: 0;
    }

    /* Text below the logo moves down together; the logo itself stays in place. */
    .text-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      flex: 0 0 auto;
      padding-top: clamp(8px, 1.5vh, 16px);
}

    .eyebrow {
      color: #876538;
      font: 700 clamp(11px, 2.6vw, 14px)/1.3 "Cormorant Garamond", serif;
      letter-spacing: .22em;
      text-transform: uppercase;
      margin: .45% 0;
    }

    .family-line {
      font-size: clamp(9px, 2.1vw, 11.5px);
      font-weight: 700;
      letter-spacing: .2em;
      margin: .45% 0 .25%;
    }

    .family-ornament {
      width: 63%;
      height: 2px;
      flex: 0 0 2px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(189,145,75,.12) 15%,
        rgba(189,145,75,.65) 50%,
        rgba(189,145,75,.12) 85%,
        transparent 100%
      );
      box-shadow: 0 0 7px rgba(189,145,75,.18);
      margin: 1.1% 0 1.1%;
    }

    .invite-line {
      color: #876538;
      font: 700 clamp(10px, 2.35vw, 12.5px)/1.35 "Cormorant Garamond", serif;
      letter-spacing: .17em;
      text-transform: uppercase;
      margin: .3% 0 .7%;
    }

    .headline {
      color: var(--burgundy);
      font: italic 600 clamp(31px, 7.2vw, 41px)/.98 "Cormorant Garamond", serif;
      margin: 1.1% 0 1%;
    }

    .blessing-line {
      color: #876538;
      font: italic 600 clamp(13px, 3vw, 16px)/1.2 "Cormorant Garamond", serif;
      letter-spacing: .025em;
      margin: 1.1% 0 1.5%;
    }

    .section-label {
      color: #8c6b3d;
      font: 700 clamp(10px, 2.4vw, 13px)/1.15 "Cormorant Garamond", serif;
      letter-spacing: .25em;
      margin: .7% 0 .15%;
    }

    .person-name {
      color: var(--burgundy);
      font-family: "Allura", cursive;
      font-size: clamp(39px, 9vw, 49px);
      font-weight: 400;
      font-style: normal;
      line-height: 1;
      white-space: nowrap;
      margin: 0;
      letter-spacing: .015em;
      text-shadow: 0 .5px 0 rgba(255,255,255,.35);
    }

    .parent-line {
      color: #6c514b;
      font: 600 clamp(13.5px, 3vw, 16px)/1.18 "Cormorant Garamond", serif;
      margin: .35% 0 1.1%;
    }

    .weds {
      color: #a77b3b;
      font: italic 600 clamp(18px, 4.2vw, 23px)/1.1 "Great Vibes", cursive;
      margin: .35% 0 .5%;
    }

    /* SAVE THE DATE design preserved for later reuse. */
    .save-date {
      border: 1.5px solid rgba(183,135,63,.9);
      border-radius: 5px;
      padding: 1.8% 7%;
      color: var(--burgundy);
      font: 700 clamp(12px, 2.9vw, 15px)/1.15 "Cormorant Garamond", serif;
      letter-spacing: .2em;
      margin-top: .8%;
      background: linear-gradient(180deg, rgba(255,250,237,.92), rgba(245,224,184,.72));
      box-shadow: 0 2px 7px rgba(145,95,35,.16), inset 0 0 0 2px rgba(183,135,63,.18);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2vw, 14px);
      width: 83.6%;
      flex: 0 0 auto;
    }

    .save-date::before,
    .save-date::after {
      content: "❧";
      color: #b8873f;
      font-family: Georgia, serif;
      font-size: clamp(22px, 5.5vw, 31px);
      line-height: .8;
      letter-spacing: 0;
      text-shadow: 0 1px 0 rgba(255,255,255,.65);
    }

    .actions {
      display: flex;
      width: 100%;
      justify-content: center;
      gap: 8px;
      margin-top: auto;
      padding-top: 3%;
      pointer-events: auto;
    }

    .action-btn {
      min-width: 0;
      flex: 1;
      border: 1px solid var(--burgundy);
      border-radius: 999px;
      padding: 10px 8px;
      color: #fff8ed;
      background: linear-gradient(135deg, #8b263b, #5c1427);
      font: 600 clamp(10px, 2.5vw, 13px)/1.1 "Cormorant Garamond", serif;
      box-shadow: 0 3px 9px rgba(91,34,31,.16);
      cursor: pointer;
    }

    .action-btn.secondary {
      color: var(--burgundy);
      background: rgba(255,248,235,.9);
    }

    .action-btn:active { transform: translateY(1px); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-height: 740px) {
      .invitation {
        top: 21%;
        bottom: 5%;
      }

      /* Approximately 20% larger than the previous short-screen logo size. */
      .wedding-logo {
        width: clamp(98px, 25.2vw, 134px);
        max-height: 106px;
      }

      .text-content {
        padding-top: clamp(10px, 1.8vh, 18px);
      }

      .headline { font-size: clamp(28px, 6.7vw, 37px); }

      .person-name { font-size: clamp(35px, 7.8vw, 43px); }

      .parent-line {
        font-size: clamp(12.5px, 2.8vw, 15px);
        margin-bottom: .7%;
      }

      .blessing-line { margin-top: .9%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="card" aria-label="Shravan and Nikki wedding invitation">

    <div class="visual video-layer" id="videoLayer">
      <video
        id="openingVideo"
        playsinline
        webkit-playsinline
        preload="auto"
        controlslist="nodownload noplaybackrate"
      >
        <source src="assets/opening-animation.mp4" type="video/mp4">
        Your browser does not support HTML video.
      </video>
    </div>

    <div class="visual opening" id="openingScreen">
      <button class="open-hotspot" id="openButton" aria-label="Open wedding invitation">
        <img src="assets/open-button.png" alt="Open">
      </button>
    </div>

    <section class="invitation" id="invitation" aria-live="polite">

      <img
        src="assets/wedding-logo.png"
        alt="Shravan and Nikki Wedding Logo"
        class="wedding-logo reveal"
        style="--delay:.15s"
      >

      <!-- All text below the logo is grouped so it can move down together. -->
      <div class="text-content">
        <p class="eyebrow family-line reveal" style="--delay:.45s">
          Together with our families
        </p>

        <div class="family-ornament reveal" style="--delay:.62s" aria-hidden="true"></div>

        <p class="invite-line reveal" style="--delay:.8s">
          Joyfully invite you to celebrate
        </p>

        <h1 class="headline reveal" style="--delay:1.05s">
          The Wedding<br>Celebration
        </h1>

        <p class="blessing-line reveal" style="--delay:1.3s">
          With the Blessings of Our Elders
        </p>

        <p class="section-label reveal" style="--delay:1.6s">
          THE GROOM
        </p>

        <h2 class="person-name reveal" style="--delay:1.85s">
          Shravan
        </h2>

        <p class="parent-line reveal" style="--delay:2.1s">
          Son of<br>
          Mrs. Savitri Yadav &amp; Mr. Suresh Yadav
        </p>

        <p class="weds reveal" style="--delay:2.4s">
          weds
        </p>

        <p class="section-label reveal" style="--delay:2.65s">
          THE BRIDE
        </p>

        <h2 class="person-name reveal" style="--delay:2.9s">
          Nikki
        </h2>

        <p class="parent-line reveal" style="--delay:3.15s">
          Daughter of<br>
          Mrs. Radha Devi &amp; Mr. Jitendra Yadav
        </p>
      </div>

      <!-- SAVE THE DATE box preserved for later use:
      <div class="save-date reveal" style="--delay:3.9s">
        SAVE THE DATE
      </div>
      -->

      <div class="actions reveal" style="--delay:3.8s">
        <button class="action-btn" id="viewInvitation" type="button">
          View Invitation
        </button>

        <button class="action-btn secondary" id="revealDate" type="button">
          Reveal the Date ♥
        </button>
      </div>

    </section>
  </main>

  <script>
    const openingScreen = document.getElementById("openingScreen");
    const openButton = document.getElementById("openButton");
    const video = document.getElementById("openingVideo");
    const invitation = document.getElementById("invitation");

    let started = false;
    let invitationTimer = null;

    // Keep the video's first frame visible and paused until OPEN is tapped.
    video.pause();

    video.addEventListener("loadeddata", () => {
      if (!started) {
        video.pause();
        video.currentTime = 0;
      }
    }, { once: true });

    async function startWeddingVideo() {
      if (started) return;

      started = true;
      openButton.disabled = true;
      openingScreen.classList.add("dismissed");
      video.currentTime = 0;

      try {
        await video.play();

        // Start invitation text 3.5 seconds after playback begins.
        invitationTimer = window.setTimeout(() => {
          invitation.classList.add("visible");
        }, 3500);

      } catch (error) {
        started = false;
        openingScreen.classList.remove("dismissed");
        openButton.disabled = false;
      }
    }

    function finishWeddingVideo() {
      // Pause on the final video frame.
      video.pause();

      if (invitationTimer !== null) {
        window.clearTimeout(invitationTimer);
      }

      invitation.classList.add("visible");
    }

    openButton.addEventListener("click", startWeddingVideo);
    video.addEventListener("ended", finishWeddingVideo);

    document.getElementById("viewInvitation").addEventListener("click", () => {
      invitation.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });

    // Reveal the Date remains a visual placeholder until the date section is added.
  </script>
</body>
</html>
